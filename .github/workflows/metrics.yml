name: Snapshot Stats (Vercel Look)

on:
  schedule:
    # Update every 12 hours
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  snapshot-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Create dist folder
        run: mkdir -p dist

      - name: Download Stats Card
        run: |
          curl "https://github-readme-stats.vercel.app/api?username=PedroMMarinho&theme=github_dark&hide=prs&show_icons=true&hide_border=true" -o dist/github-stats.svg

      - name: Download Languages Card
        run: |
          curl "https://github-readme-stats.vercel.app/api/top-langs/?username=PedroMMarinho&layout=compact&theme=github_dark&hide=Makefile,Cmake,Shell,Starlark,M4,Html,teX&line_height=27&hide_border=true" -o dist/github-langs.svg

      - name: Push to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true 
          commit_message: "Update stats snapshot"
